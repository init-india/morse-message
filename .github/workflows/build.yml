name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Morse engine)
        run: ./gradlew testFdroidDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleFdroidDebug assemblePlayDebug --stacktrace

      # F-Droid builds the unsigned, minified release variant: make sure it builds too.
      - name: Build F-Droid release variant (as F-Droid will)
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Collect APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/fdroid/debug/*.apk "out/MorseMessage-${VERSION}-fdroid-debug.apk"
          cp app/build/outputs/apk/play/debug/*.apk   "out/MorseMessage-${VERSION}-play-debug.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: MorseMessage-apks
          path: out/*.apk

      # Every push to main refreshes a "latest-build" pre-release with ready-to-install APKs.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic debug build of the latest commit on main, for testing. Install MorseMessage-*-fdroid-debug.apk on an Android 10+ phone (allow installing from unknown sources). Debug builds install as a separate app (package io.github.init_india.morsemessage.debug)."

      # A new versionName on main gets its own release and tag (v<versionName>), e.g. v0.9.0.
      # F-Droid builds from these tags. Nothing happens if that version was already released.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION already released"
          else
            gh release create "v$VERSION" out/*.apk \
              --target "$GITHUB_SHA" \
              --title "Morse Message $VERSION" \
              --notes-file "fastlane/metadata/android/en-US/changelogs/$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts).txt"
          fi

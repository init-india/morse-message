name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (Morse engine)
        run: ./gradlew testFdroidDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew assembleFdroidDebug assemblePlayDebug --stacktrace

      - name: Collect APKs
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/fdroid/debug/*.apk "out/MorseMessage-${VERSION}-fdroid-debug.apk"
          cp app/build/outputs/apk/play/debug/*.apk   "out/MorseMessage-${VERSION}-play-debug.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: MorseMessage-apks
          path: out/*.apk

      # Every push to main refreshes a "latest-build" pre-release with ready-to-install APKs.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA::7})" \
            --notes "Automatic debug build of the latest commit on main, for testing. Install MorseMessage-*-fdroid-debug.apk on an Android 10+ phone (allow installing from unknown sources). Debug builds install as a separate app (package com.morsemessage.debug)."

      # Tags like v0.6.0 get their own release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "Morse Message $GITHUB_REF_NAME" --generate-notes
